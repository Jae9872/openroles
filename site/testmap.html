<!doctype html><html><head><meta charset='utf-8'>
<link href='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css' rel='stylesheet'>
<script src='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js'></script>
<style>body{margin:0}#map{width:100vw;height:100vh}</style></head><body>
<div id='map'></div>
<script>
const map = new maplibregl.Map({ container:'map', style: 'https://demotiles.maplibre.org/style.json', center:[0,20], zoom:2 });
map.on('load', ()=>{ document.title='LOADED'; console.log('LOAD FIRED'); });
map.on('error', e=>console.error('ERR', e && e.error && e.error.message));
</script></body></html>
