<!doctype html><html lang='en'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>openroles — atlas</title>
<script src='https://unpkg.com/globe.gl@2.33.0/dist/globe.gl.min.js'></script>
<style>
:root{--bg:#09090b;--surf:#18181b;--surf2:#1f1f23;--border:#27272a;--text:#f4f4f5;--muted:#a1a1aa;--dim:#71717a;
--blue:#60a5fa;--emerald:#34d399;--violet:#a78bfa;--amber:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
.wrap{display:grid;grid-template-columns:1fr 380px;height:100vh}
#globe{width:100%;height:100%;background:radial-gradient(ellipse at center,#0b1220 0%,#05070a 100%)}
.panel{background:rgba(24,24,27,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel h1{font-size:16px;margin:0;padding:14px 16px;border-bottom:1px solid var(--border);letter-spacing:-.01em;font-weight:600}
.panel .meta{padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
.panel .search{padding:8px 16px;border-bottom:1px solid var(--border)}
.panel .search input{width:100%;padding:7px 11px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:13px}
.panel .search input:focus{outline:none;border-color:var(--blue)}
.panel .list{flex:1;overflow-y:auto;padding:4px 0}
.panel .row{padding:10px 16px;cursor:pointer;transition:background 150ms;border-left:2px solid transparent}
.panel .row:hover{background:rgba(255,255,255,.03)}
.panel .row.sel{background:rgba(96,165,250,.08);border-left-color:var(--blue)}
.panel .row .name{font-weight:500;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.panel .row .count{color:var(--emerald);font-size:11px;font-weight:600}
.panel .row .loc{color:var(--dim);font-size:11px;margin-top:2px}
.panel .row .badges{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.panel .badge{font-size:9px;padding:1px 6px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.panel .selected-card{padding:16px;border-bottom:1px solid var(--border);background:rgba(96,165,250,.04);position:relative}
.panel .selected-card .title{font-size:15px;font-weight:600;margin-bottom:2px}
.panel .selected-card .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.panel .selected-card .stats{display:flex;gap:12px;font-size:12px;margin-bottom:10px}
.panel .selected-card .stats span{color:var(--muted)}
.panel .selected-card .stats b{color:var(--text)}
.panel .selected-card .roles{max-height:420px;overflow-y:auto}
.panel .selected-card .role{padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.panel .selected-card .role a{color:var(--blue);text-decoration:none}
.panel .selected-card .role a:hover{text-decoration:underline}
.panel .selected-card .close{position:absolute;top:12px;right:12px;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px}
.legend{padding:8px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .dot{width:8px;height:8px;border-radius:50%}
.back{display:inline-block;margin:0 16px 12px;color:var(--blue);font-size:12px;text-decoration:none}
.bar{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:1000;
  display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;
  background:rgba(24,24,27,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.bar .title{font-weight:600;font-size:13px;letter-spacing:-.01em;margin-right:6px;
  background:linear-gradient(90deg,var(--blue),var(--emerald));-webkit-background-clip:text;background-clip:text;color:transparent}
.bar button{padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;transition:all 150ms ease-out;
  display:inline-flex;align-items:center;gap:4px}
.bar button:hover{border-color:#3f3f46;color:var(--text)}
.bar button.on{border-color:var(--text);color:var(--text);background:rgba(255,255,255,.06)}
.bar button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bar .count{color:var(--dim);font-size:10px}
.listview{display:none;position:absolute;inset:0;z-index:800;background:var(--bg);overflow-y:auto;padding:70px 24px 24px}
.listview.on{display:block}
.listview .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.listview .card{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:14px;transition:transform 150ms;cursor:pointer}
.listview .card:hover{transform:translateY(-2px);border-color:#3f3f46}
.listview .card h3{font-size:14px;margin:0 0 4px}
.listview .card .meta{color:var(--muted);font-size:12px}
.listview .card .badges{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
.listview .card .badge{font-size:9px;padding:1px 6px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.globe-tooltip{background:rgba(24,24,27,.9);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;pointer-events:none}
@media (max-width:720px){
  .wrap{grid-template-columns:1fr}
  .panel{position:absolute;bottom:0;left:0;right:0;width:100%;height:50vh;border-radius:12px 12px 0 0;border-left:none;border-top:1px solid var(--border)}
  .bar{font-size:11px;padding:6px 8px;flex-wrap:wrap;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class='wrap'>
  <div id='globe'></div>
  <div class='bar' role='toolbar' aria-label='Filter and navigate'>
    <span class='title'>openroles atlas</span>
    <button data-f='all' class='on' onclick='filt("all")'>All <span class='count' id='c-all'>0</span></button>
    <button data-f='visa' onclick='filt("visa")'>🛂 Visa <span class='count' id='c-visa'>0</span></button>
    <button data-f='remote' onclick='filt("remote")'>🌐 Remote <span class='count' id='c-remote'>0</span></button>
    <button data-f='equity' onclick='filt("equity")'>📈 Equity <span class='count' id='c-equity'>0</span></button>
    <button class='toggle' onclick='toggleView()'>List view</button>
    <button class='toggle' onclick='cycleStyle()'>Style: Night</button>
  </div>
  <aside class='panel' id='panel'>
    <h1>Companies</h1>
    <div class='meta' id='meta'>Loading…</div>
    <div class='countries' id='countries' style='padding:8px 16px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted)'>Loading countries…</div>
    <div class='search'><input id='q' type='search' placeholder='Filter companies…' aria-label='Filter companies'></div>
    <div class='list' id='list'></div>
    <div class='legend'>
      <span><span style='width:8px;height:8px;border-radius:50%;background:#60a5fa;display:inline-block'></span> &lt;10 roles</span>
      <span><span style='width:10px;height:10px;border-radius:50%;background:#a78bfa;display:inline-block'></span> 10-50</span>
      <span><span style='width:12px;height:12px;border-radius:50%;background:#34d399;display:inline-block'></span> 50+</span>
    </div>
    <a class='back' href='index.html'>← back to feed</a>
  </aside>
  <div class='listview' id='listview'>
    <h1 style='font-size:20px;margin-bottom:16px'>All companies</h1>
    <div class='grid' id='grid'></div>
  </div>
</div>
<script>
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var geo = null, selected = null, currentFilter = 'all';

function hasFlag(feat, flag){ return (feat.properties.flags||'').split(' ').indexOf(flag) !== -1; }

var globe = Globe()(document.getElementById('globe'))
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
  .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
  .showAtmosphere(true)
  .atmosphereColor('#60a5fa')
  .atmosphereAltitude(0.18)
  .pointAltitude(0.01)
  .pointColor(d => d.flags && d.flags.includes('visa') ? '#34d399' : (d.flags && d.flags.includes('equity') ? '#a78bfa' : '#60a5fa'))
  .pointRadius(d => Math.max(0.45, Math.min(1.1, d.jobs / 30)))
  .pointLabel(d => '<div class="globe-tooltip"><b>'+d.name+'</b><br>'+d.jobs+' open roles</div>')
  .onPointClick(d => selectCompany(d))
  .onPointHover(d => { document.body.style.cursor = d ? 'pointer' : 'default'; });

if (!prefersReduced) globe.controls().autoRotate = true;
globe.controls().autoRotateSpeed = 0.35;
globe.controls().enableDamping = true;
globe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 0);
window.globe = globe;

const STYLES = [
  { name: 'Night', url: 'https://unpkg.com/three-globe/example/img/earth-night.jpg', bump: 'https://unpkg.com/three-globe/example/img/earth-topology.png', bg: 'https://unpkg.com/three-globe/example/img/night-sky.png', atm: '#60a5fa' },
  { name: 'Blue Marble', url: 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg', bump: 'https://unpkg.com/three-globe/example/img/earth-topology.png', bg: 'https://unpkg.com/three-globe/example/img/night-sky.png', atm: '#38bdf8' },
  { name: 'Topology', url: 'https://unpkg.com/three-globe/example/img/earth-topology.png', bump: 'https://unpkg.com/three-globe/example/img/earth-topology.png', bg: '#05070a', atm: '#a78bfa' },
];
let styleIdx = 0;
function cycleStyle() {
  styleIdx = (styleIdx + 1) % STYLES.length;
  const s = STYLES[styleIdx];
  globe.globeImageUrl(s.url).bumpImageUrl(s.bump).backgroundImageUrl(s.bg).atmosphereColor(s.atm);
  document.querySelector('.bar .toggle:last-of-type').textContent = 'Style: ' + s.name;
}

function applyFilter(f){
  currentFilter = f;
  document.querySelectorAll('.bar button[data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === f));
  const feats = (geo?.features || []).filter(x => f==='all' || hasFlag(x, f));
  const top = feats.slice().sort((a,b)=>b.properties.jobs-a.properties.jobs).slice(0, 25);
  const topCos = feats.slice().sort((a,b)=>b.properties.jobs-a.properties.jobs).slice(0, 50);
  globe.pointsData(feats.map(feat => ({
    id: feat.properties.id, name: feat.properties.name, jobs: feat.properties.jobs,
    lat: feat.geometry.coordinates[1], lng: feat.geometry.coordinates[0],
    source: feat.properties.source, flags: feat.properties.flags || ''
  })));
  // letter-avatar "logos" for top companies (self-contained, no API key)
  globe.htmlElementsData(topCos.map(feat => ({
    id: feat.properties.id, name: feat.properties.name, jobs: feat.properties.jobs,
    lat: feat.geometry.coordinates[1], lng: feat.geometry.coordinates[0],
    color: feat.properties.flags && feat.properties.flags.includes('visa') ? '#34d399' : (feat.properties.flags && feat.properties.flags.includes('equity') ? '#a78bfa' : '#60a5fa')
  })));
  globe.htmlElement(d => {
    const el = document.createElement('div');
    el.style.cssText = 'width:22px;height:22px;border-radius:50%;background:'+d.color+';color:#09090b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;border:2px solid #09090b;box-shadow:0 0 0 1px '+d.color+'60;cursor:pointer;transition:transform 150ms';
    el.textContent = (d.name||'?')[0].toUpperCase();
    el.title = d.name + ' · ' + d.jobs + ' roles';
    el.addEventListener('mouseenter', () => { el.style.transform = 'scale(1.25)'; });
    el.addEventListener('mouseleave', () => { el.style.transform = 'scale(1)'; });
    el.addEventListener('click', () => { const feat = geo.features.find(f => f.properties.id === d.id); if (feat) selectCompany(feat); });
    return el;
  });
  globe.labelsData(top.map(feat => ({
    id: feat.properties.id, name: feat.properties.name, jobs: feat.properties.jobs,
    lat: feat.geometry.coordinates[1], lng: feat.geometry.coordinates[0]
  })));
  globe.labelText(d => d.name);
  globe.labelSize(d => Math.max(0.4, Math.min(1.2, d.jobs / 200)));
  globe.labelColor(() => 'rgba(244,244,245,0.75)');
  globe.labelDotRadius(0.3);
  globe.labelAltitude(0.012);
  renderList(document.getElementById('q').value);
  renderGrid();
}

function renderList(filter=''){
  const list = document.getElementById('list');
  list.innerHTML = '';
  const f = filter.toLowerCase();
  const feats = (geo?.features || [])
    .filter(x => !f || (x.properties.name||'').toLowerCase().includes(f))
    .filter(x => currentFilter==='all' || hasFlag(x, currentFilter))
    .sort((a,b)=> b.properties.jobs - a.properties.jobs);
  const total = feats.reduce((s,x)=>s+x.properties.jobs,0);
  document.getElementById('meta').textContent = feats.length + ' companies · ' + total + ' roles';
  document.getElementById('c-all').textContent = (geo?.features||[]).length;
  document.getElementById('c-visa').textContent = (geo?.features||[]).filter(x=>hasFlag(x,'visa')).length;
  document.getElementById('c-remote').textContent = (geo?.features||[]).filter(x=>hasFlag(x,'remote')).length;
  document.getElementById('c-equity').textContent = (geo?.features||[]).filter(x=>hasFlag(x,'equity')).length;
  feats.slice(0, 200).forEach(feat => {
    const d = document.createElement('div');
    d.className = 'row' + (selected && selected.properties.id===feat.properties.id ? ' sel' : '');
    d.innerHTML = '<div class="name">'+feat.properties.name+'<span class="count">'+feat.properties.jobs+'</span></div>'+
                  '<div class="loc">'+(feat.properties.source||'')+'</div>'+
                  (feat.properties.flags ? '<div class="badges">'+feat.properties.flags.split(' ').filter(Boolean).map(x=>'<span class="badge">'+x+'</span>').join('')+'</div>' : '');
    d.addEventListener('click', () => selectCompany(feat));
    list.appendChild(d);
  });
}

function selectCompany(feat){
  selected = feat;
  const [lng, lat] = feat.geometry.coordinates;
  globe.pointOfView({ lat, lng, altitude: 1.6 }, prefersReduced ? 0 : 900);
  renderList(document.getElementById('q').value);
  showSelectedCard(feat);
}

function showSelectedCard(feat){
  const panel = document.getElementById('panel');
  let card = document.getElementById('selected-card');
  if (!card){ card = document.createElement('div'); card.id='selected-card'; card.className='selected-card'; panel.insertBefore(card, panel.querySelector('.list')); }
  card.innerHTML = '<button class="close" onclick="clearSelection()" aria-label="Close">×</button>'+
    '<div class="title">'+feat.properties.name+'</div>'+
    '<div class="sub">'+(feat.properties.source||'')+' · '+feat.properties.jobs+' open roles</div>'+
    '<div class="stats"><span><b>'+feat.properties.jobs+'</b> roles</span></div>'+
    '<div class="roles" id="roles-list">Loading roles…</div>';
  fetch('jobs_sample.json').then(r=>r.json()).then(jobs => {
    const jl = jobs.filter(j => (j.company_slug||j.company) === feat.properties.id).slice(0, 40);
    const el = document.getElementById('roles-list');
    if (!jl.length){ el.textContent = 'No roles in sample (full list on feed).'; return; }
    el.innerHTML = jl.map(j => '<div class="role"><a href="'+j.url+'" target="_blank" rel="noopener">'+j.title+'</a><br><span style="color:#71717a">'+(j.location||'')+'</span></div>').join('');
  }).catch(()=>{ document.getElementById('roles-list').textContent = 'Roles list unavailable.'; });
}

function clearSelection(){
  selected = null;
  const c = document.getElementById('selected-card'); if (c) c.remove();
  renderList(document.getElementById('q').value);
}

function renderGrid(){
  const grid = document.getElementById('grid');
  if (!grid) return;
  grid.innerHTML = '';
  const feats = (geo?.features || []).filter(x => currentFilter==='all' || hasFlag(x, currentFilter))
    .sort((a,b)=> b.properties.jobs - a.properties.jobs).slice(0, 60);
  feats.forEach(feat => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = '<h3>'+feat.properties.name+'</h3><div class="meta">'+feat.properties.jobs+' roles · '+(feat.properties.source||'')+'</div>'+
      '<div class="badges">'+(feat.properties.flags||'').split(' ').filter(Boolean).map(x=>'<span class="badge">'+x+'</span>').join('')+'</div>';
    d.addEventListener('click', () => { toggleView(); setTimeout(()=>selectCompany(feat), 100); });
    grid.appendChild(d);
  });
}

function toggleView(){
  const lv = document.getElementById('listview');
  lv.classList.toggle('on');
  document.querySelector('.toggle').textContent = lv.classList.contains('on') ? 'Globe view' : 'List view';
  if (lv.classList.contains('on')) renderGrid();
}

fetch('companies.geojson').then(r=>r.json()).then(data => {
  geo = data; window.geo = geo;
  applyFilter('all');
  fetch('countries.json').then(r=>r.json()).then(cs => {
    const el = document.getElementById('countries');
    el.innerHTML = '<div style="font-weight:600;color:var(--text);margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em">Top countries</div>' +
      cs.slice(0, 10).map(c => '<div style="display:flex;justify-content:space-between;padding:2px 0"><span>'+c.country+'</span><span style="color:var(--emerald)">'+c.jobs.toLocaleString()+'</span></div>').join('');
  }).catch(()=>{});
}).catch(err => {
  document.getElementById('meta').textContent = 'Failed to load companies.geojson';
  console.error(err);
});

document.getElementById('q').addEventListener('input', e => renderList(e.target.value));
</script>
</body></html>
