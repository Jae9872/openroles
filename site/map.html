<!doctype html><html lang='en'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>openroles — map</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<link rel='stylesheet' href='https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css' />
<link rel='stylesheet' href='https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<script src='https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js'></script>
<style>
:root{--bg:#09090b;--surf:#18181b;--border:#27272a;--text:#f4f4f5;--muted:#a1a1aa;--dim:#71717a;--blue:#60a5fa;--emerald:#34d399}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.wrap{display:grid;grid-template-columns:1fr 360px;height:100vh}
#map{width:100%;height:100%;background:#0b1220}
.panel{background:var(--surf);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel h1{font-size:16px;margin:0;padding:14px 16px;border-bottom:1px solid var(--border)}
.panel .meta{padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
.panel .search{padding:8px 16px;border-bottom:1px solid var(--border)}
.panel .search input{width:100%;padding:6px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:13px}
.panel .list{flex:1;overflow-y:auto}
.panel .row{padding:10px 16px;border-bottom:1px solid #1f1f23;cursor:pointer;transition:background 150ms}
.panel .row:hover{background:#1f1f23}
.panel .row.sel{background:#27272a;border-left:2px solid var(--blue)}
.panel .row .name{font-weight:500;font-size:13px}
.panel .row .count{color:var(--emerald);font-size:11px;margin-left:6px}
.panel .row .loc{color:var(--dim);font-size:11px;margin-top:2px}
.back{display:inline-block;margin:12px 16px 0;color:var(--blue);font-size:12px;text-decoration:none}
.legend{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--dim)}
.leaflet-popup-content{background:var(--surf);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px}
.leaflet-popup-tip{background:var(--surf)}
.marker-cluster-small{background-color:rgba(96,165,250,.6)}
.marker-cluster-small div{background-color:rgba(96,165,250,.9);color:#09090b}
.marker-cluster-medium{background-color:rgba(167,139,250,.6)}
.marker-cluster-medium div{background-color:rgba(167,139,250,.9);color:#09090b}
.marker-cluster-large{background-color:rgba(52,211,153,.6)}
.marker-cluster-large div{background-color:rgba(52,211,153,.9);color:#09090b}
</style></head><body>
<div class='wrap'>
  <div id='map'></div>
  <aside class='panel'>
    <h1>openroles — map</h1>
    <div class='meta' id='meta'>Loading companies…</div>
    <div class='search'><input id='q' type='search' placeholder='Filter companies…' aria-label='Filter companies'></div>
    <div class='list' id='list'></div>
    <div class='legend'>955 companies with resolved locations · clustered markers · click a pin or a row</div>
    <a class='back' href='index.html'>← back to feed</a>
  </aside>
</div>
<script>
const map = L.map('map', { worldCopyJump: true }).setView([20, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 18
}).addTo(map);

const markers = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 45 });
let geo = null, selected = null, markerById = {};

function renderList(filter=''){
  const list = document.getElementById('list');
  list.innerHTML = '';
  const f = filter.toLowerCase();
  const feats = (geo?.features || [])
    .filter(x => !f || (x.properties.name||'').toLowerCase().includes(f))
    .sort((a,b)=> b.properties.jobs - a.properties.jobs);
  document.getElementById('meta').textContent = feats.length + ' companies · ' + feats.reduce((s,x)=>s+x.properties.jobs,0) + ' roles';
  feats.slice(0, 300).forEach(feat => {
    const d = document.createElement('div');
    d.className = 'row' + (selected && selected.properties.id===feat.properties.id ? ' sel' : '');
    d.innerHTML = '<div class="name">'+feat.properties.name+'<span class="count">'+feat.properties.jobs+'</span></div>'+
                  '<div class="loc">'+(feat.properties.source||'')+'</div>';
    d.addEventListener('click', () => selectCompany(feat));
    list.appendChild(d);
  });
}

function selectCompany(feat){
  selected = feat;
  const [lng, lat] = feat.geometry.coordinates;
  map.flyTo([lat, lng], Math.max(map.getZoom(), 5), { duration: 0.8 });
  if (markerById[feat.properties.id]) markerById[feat.properties.id].openPopup();
  renderList(document.getElementById('q').value);
}

fetch('companies.geojson').then(r=>r.json()).then(data => {
  geo = data;
  data.features.forEach(feat => {
    const [lng, lat] = feat.geometry.coordinates;
    const m = L.marker([lat, lng]);
    m.bindPopup('<b>'+feat.properties.name+'</b><br>'+feat.properties.jobs+' open roles<br><span style="color:#71717a">'+(feat.properties.source||'')+'</span>');
    m.on('click', () => selectCompany(feat));
    markers.addLayer(m);
    markerById[feat.properties.id] = m;
  });
  map.addLayer(markers);
  renderList();
}).catch(err => {
  document.getElementById('meta').textContent = 'Failed to load companies.geojson';
  console.error(err);
});

document.getElementById('q').addEventListener('input', e => renderList(e.target.value));
</script>
</body></html>
