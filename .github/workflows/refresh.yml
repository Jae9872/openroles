name: Refresh job data (every 12h)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild site from current data
        run: |
          python3 scripts/enrich.py
          python3 scripts/build_geojson.py
          python3 scripts/build_site.py
          python3 scripts/ci_all.py
      - name: Commit if changed
        run: |
          git config user.name "openroles-bot"
          git config user.email "bot@openroles"
          git add data/ site/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "refresh: data + site rebuild"
          git push
